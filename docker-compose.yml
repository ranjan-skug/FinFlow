services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - finflow_mongo:/data/db
  server:
    build: ./server
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/finflow
      JWT_SECRET: change-this-secret
      CLIENT_URL: http://localhost:5173
      NODE_ENV: development
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
  client:
    build: ./client
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "5173:5173"
    depends_on:
      - server
volumes:
  finflow_mongo:
